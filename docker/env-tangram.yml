# Dependency spec baked into docker/tangram.Dockerfile.
name: base
channels:
  - conda-forge
dependencies:
  - python=3.11.11
  - anndata=0.13.3
  - scanpy=1.12.4
  - numpy=2.1.3
  - pandas=2.2.3
  - scipy=1.14.1
  - scikit-learn=1.6.1
  - matplotlib-base=3.10.0
  - h5py=3.12.1
  - pip=24.3.1
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch==2.13.0
      - tangram-sc==1.0.4
