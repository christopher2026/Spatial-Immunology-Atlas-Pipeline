name: CI

# Starts as a cheap correctness gate that passes from day one, and grows into the full pipeline run
# in Phase 6. A workflow that is red from the start gets ignored; a workflow that is green from the
# start gets trusted, and you notice the day it breaks.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.9.2
      - name: ruff check
        run: ruff check bin/
      - name: ruff format --check
        run: ruff format --check bin/

  nextflow-config:
    name: Validate Nextflow config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: nf-core/setup-nextflow@v2
      # `nextflow config` resolves and prints the fully merged configuration. It fails on syntax
      # errors and on profiles that reference missing includes, which catches most config mistakes
      # in seconds without needing any data.
      - name: Resolve every profile
        run: |
          nextflow config -profile docker
          nextflow config -profile test
          nextflow config -profile test,docker
      - name: Parse main.nf
        run: nextflow run main.nf --help -profile test

