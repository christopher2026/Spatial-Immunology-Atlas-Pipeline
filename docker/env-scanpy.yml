# Dependency spec baked into docker/scanpy_squidpy.Dockerfile.
# Kept as a separate file (rather than inline RUN commands) so Docker layer caching only invalidates
# when dependencies actually change, and so the exact contents are diffable in git.
name: base
channels:
  - conda-forge
dependencies:
  - python=3.11.11
  - pip=24.3.1
  - pip:
      # These releases are currently on PyPI but not conda-forge. Installing them with pip avoids
      # a solver failure while keeping the micromamba base for Python and the container runtime.
      - anndata==0.12.19
      - scanpy==1.11.5
      - squidpy==1.8.2
      - leidenalg==0.10.2
      - python-igraph==0.11.8
      - numpy==2.1.3
      - pandas==2.2.3
      - scipy==1.14.1
      - scikit-learn==1.6.1
      - scikit-image==0.25.2
      - matplotlib==3.10.0
      - seaborn==0.13.2
      - h5py==3.12.1
      - numba==0.61.0
      - scrublet==0.2.3
