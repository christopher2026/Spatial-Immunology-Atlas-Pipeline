# Local development environment for standalone `bin/*.py` iteration.
#
# This is deliberately NOT the same thing as the Docker images. The containers in docker/ are what
# Nextflow uses and what CI reproduces; this env exists so you can iterate on scripts in seconds
# without rebuilding an image. Version pins are kept in sync with docker/scanpy_squidpy.Dockerfile.
#
#   micromamba create -y -n stpipe -f env/environment.yml
#   micromamba activate stpipe
#
# Python 3.11 rather than 3.13: the scanpy/squidpy/torch/tangram stack has the widest wheel coverage
# there, and a deconvolution project is not the place to be debugging missing binary wheels.
name: stpipe
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - pip

  - pip:
      # These current releases are on PyPI but are not yet published on conda-forge, which is why
      # putting them above as conda dependencies makes libmamba report "does not exist". Pip is the
      # correct channel here; the wheels bundle the needed compiled pieces.
      # AnnData 0.13 requires Python >=3.12; this project intentionally uses Python 3.11 for
      # wider torch/Tangram wheel coverage, so use the latest compatible 0.12 release.
      - anndata==0.12.19
      # Scanpy 1.12 and Squidpy 1.8.3 require Python >=3.12. These latest Python 3.11-compatible
      # releases preserve the same APIs needed by this project.
      - scanpy==1.11.5
      - squidpy==1.8.2

      # CPU-only torch wheels. Without this index the default PyPI wheel drags in ~3 GB of CUDA
      # libraries you will never use, since this dataset runs fine on CPU.
      - --extra-index-url https://download.pytorch.org/whl/cpu

      # Clustering, numerics, plotting and spatial dependencies not pulled in by the three packages
      # above. Exact pins make the local environment match the containers and CI.
      - h5py==3.12.1
      - scikit-image==0.25.2
      # leidenalg 0.12 requires igraph >=1.0, but python-igraph 0.11.8 supplies igraph 0.11.8.
      # This pair is compatible and provides the Leiden backend scanpy needs.
      - leidenalg==0.10.2
      - python-igraph==0.11.8
      - numpy==2.1.3
      - pandas==2.2.3
      - scipy==1.14.1
      - scikit-learn==1.6.1
      - matplotlib==3.10.0
      - seaborn==0.13.2
      - numba==0.61.0

      # Doublet detection. Kept on pip because the conda-forge build lags releases.
      - scrublet==0.2.3
      # Tangram + torch live here too so you can prototype Phase 4 in the same env.
      # The pipeline itself uses the dedicated docker/tangram.Dockerfile image.
      - torch==2.13.0
      - tangram-sc==1.0.4

      # Reporting and development tools.
      - jinja2==3.1.5
      - tabulate==0.9.0
      - ipykernel
      - jupyterlab
      - ruff==0.9.2
